name: Visualizer backtest correctness

on:
  push:
    branches:
      - fix/visualizer-backtest-logic-20261118
    paths:
      - 'visualizer/backend/**'
      - 'visualizer/frontend/**'
      - '.github/workflows/visualizer-backtest-logic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visualizer/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app tests
      - name: Run regression and existing correctness tests
        run: python -m pytest -q tests/test_backtest_correctness_20261118.py tests/test_v15_1_correctness.py tests/test_engine_v4.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visualizer/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
