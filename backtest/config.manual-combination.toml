# ============================================================
# CONFIG 01
# ORIGINAL BASELINE
# BASELINE ENTRY + FULL_BBO EXECUTION
#
# Historical Jan-Sep 2026 result:
#
# Trades        : 2013
# Wins          : 453
# Losses        : 1560
# Win rate      : 22.50%
# Net P&L       : +$912.67
# Profit factor : 1.817
# Max drawdown  : $58.14
# Profitable months: 7 / 9
#
# IMPORTANT:
# Historical result contained the large August execution
# outlier discussed during our audit. This config is kept
# primarily as the original research baseline.
# ============================================================

name = "01_baseline_full_bbo"

bt_families = [1]

exit_policy = "PLAIN"


# ============================================================
# BACKTEST DATA
# ============================================================

[backtest]

source = "PUBLIC_HISTORY"

start_date = "2026-09-01"

end_date = "2026-09-30"

months = []

directory = "backtest/data/delta-history"


# ============================================================
# ENTRY
# ============================================================

[entry]

mode = "BASELINE"


# ============================================================
# EXIT
# ============================================================

[exit]

ema_rule = "FAST_OR_MID_VS_SLOW"

max_hold_hours = "NONE"

# exit_days_to_expiry = 1.3


# ============================================================
# PROFIT PROTECTION
# DISABLED
# ============================================================

[profit_protection]

mode = "TRAILING"

enabled = false

activation_percent = 10.0

protect_percent = 10.0


# ============================================================
# GLOBAL ENTRY FILTERS
# ALL RESEARCH FILTERS DISABLED
# ============================================================

[filters]

macd = false

h6 = false

h6_true_ranges = 6

fee_aware_multiplier = 0.0

m30 = false

m30_minutes = 30

stoch_momentum = false

# No global volume-ratio filter.
min_signal_volume_ratio = 0.0

# No VWAP displacement filter.
min_vwap_displacement_atr = 0.0

# No minimum EMA strength.
min_ema_strength_atr = 0.0

# No maximum EMA overextension filter.
max_ema_strength_atr = "NONE"


# ============================================================
# ZIGZAG
#
# Inactive because:
# entry.mode = "BASELINE"
# ============================================================

[zigzag]

pullback_lookback_candles = 4

touch_ema20 = true

touch_vwap = true

require_ema_slope = false

allow_flat_ema50 = true

max_touch_close_distance_atr = "NONE"

use_actual_pullback_sequence = true

rsi_enabled = true

bull_rsi_min = 40.0

bull_rsi_max = 55.0

bear_rsi_min = 45.0

bear_rsi_max = 60.0

atr_enabled = false

atr_reversal_multiplier = 0.4


# ============================================================
# MOMENTUM BREAKOUT
#
# Inactive because:
# entry.mode = "BASELINE"
# ============================================================

[momentum_breakout]

lookback_candles = 6

breakout_buffer_atr = 0.0

min_volume_ratio = 1.25

min_vwap_displacement_atr = 1.0

min_ema_strength_atr = 0.0

max_ema_strength_atr = 0.75


# ============================================================
# EARLY FAILURE
# DISABLED
# ============================================================

[early_failure]

enabled = false

monitor_candles = 3

condition_mode = "ANY"

exit_on_vwap_failure = true

vwap_reclaim_candles = 0

exit_on_structure_break = true

structure_lookback_candles = 4

exit_on_ema9_ema20_cross = true


# ============================================================
# EXECUTION
#
# ORIGINAL OPTIMISTIC FULL-BBO MODEL
# ============================================================

[execution]

mode = "FULL_BBO"

size_participation_rate = 1.0

size_capacity_multiplier = 1.0

entry_fill_timeout_seconds = 0.0

minimum_entry_fill_percent = 0.0

exit_fill_timeout_seconds = 300.0

unfilled_exit_policy = "ZERO"


# ============================================================
# RISK
# ============================================================

[risk]

hard_stop_percent = -15.0

hard_stop_fill_mode = "NEXT_QUOTE"


# ============================================================
# LIQUIDITY
# ============================================================

[liquidity]

max_spread_percent = 3.0

min_volume = 30.0

volume_quantity_multiplier = 5.0


# ============================================================
# OPTION SELECTION
# ============================================================

[option]

min_days_to_expiry = 1.3

min_days_to_expiry_inclusive = true

max_days_to_expiry = 3.0


# ============================================================
# SESSION
# ============================================================

[session]

entry_windows_ist = []

no_trade_days = ["Saturday", "Sunday"]
