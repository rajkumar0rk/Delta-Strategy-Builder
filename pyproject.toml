[project]
name = "delta-strategy-backtest"
version = "0.1.0"
description = "BTC options research and historical backtest engine"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
